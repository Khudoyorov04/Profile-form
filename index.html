<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zamonaviy profil</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0f2922 0%, #143d33 100%);
      color: #e8f5ef;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      margin-top: 100px;
      max-width: 600px;
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 25px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    h1 { text-align: center; margin-bottom: 12px; }
    p { text-align: center; color: #b8ccc3; margin-bottom: 20px; }

    label { display: block; font-weight: 600; margin-bottom: 6px; }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: #e8f5ef;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #36b487;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #2d9d74; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Profil ma'lumotlari</h1>
    <p>Zamonaviy motivatsion dizayn</p>

    <label>Ism</label>
    <input id="name" type="text" placeholder="Ismingiz">

    <label>Familiya</label>
    <input id="surname" type="text" placeholder="Familiyangiz">

    <label>Bio</label>
    <textarea id="bio" placeholder="O'zingiz haqida qisqacha..."></textarea>

    <button id="sendBtn" class="btn">Jo‘natish Telegramga</button>
    <p style="text-align:center; color:#b8ccc3; margin-top:8px;">Ma'lumotlar @Khudoyorov_04 ga yuboriladi.</p>
  </div>

  <script>
    const BOT_TOKEN = "8352871965:AAHnFMXCKUX-egMob1cwz10BgrozMrDzlRw";
    const CHAT_ID = "6029761760";

    document.getElementById("sendBtn").addEventListener("click", () => {
      const name = document.getElementById("name").value.trim();
      const surname = document.getElementById("surname").value.trim();
      const bio = document.getElementById("bio").value.trim();

      if (!name && !surname && !bio) {
        alert("Iltimos, kamida bitta maydonni to‘ldiring.");
        return;
      }

      const message = 🧾 Yangi profil ma'lumotlari:\n\n👤 Ism: ${name} ${surname}\n📝 Bio: ${bio};

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: message
        })
      })
      .then(res => res.json())
      .then(data => {
        if(data.ok) alert("✅ Ma'lumot yuborildi!");
        else alert("❌ Xatolik yuz berdi!");
      })
      .catch(err => {
        console.error(err);
        alert("❌ Xatolik yuz berdi!");
      });
    });
  </script>

</body>
</html>
